[package]
name = "decomps-launcher"
version = "0.1.0"
description = "Library and launcher for the Decomps workspace games"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: serve ui/ from the exe; there is no dev server.
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }  # keeps shortcuts.json key order on rewrite
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
